# nginx-proxy.conf
#
# This file goes on the droplet at /etc/nginx/sites-available/skidjakt.linkasaurus.se
# It acts as a reverse proxy in front of the Docker containers.
#
# Installation:
#   1. Copy to: /etc/nginx/sites-available/skidjakt.linkasaurus.se
#   2. Symlink:  sudo ln -s /etc/nginx/sites-available/skidjakt.linkasaurus.se /etc/nginx/sites-enabled/
#   3. Test:     sudo nginx -t
#   4. Reload:   sudo systemctl reload nginx
#

server {
    listen 80;
    server_name skidjakt.linkasaurus.se;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name skidjakt.linkasaurus.se;

    # SSL certificate paths (will be created by certbot)
    ssl_certificate /etc/letsencrypt/live/skidjakt.linkasaurus.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skidjakt.linkasaurus.se/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to frontend container (nginx serving static files)
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to backend API
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (for /api/deals/stream)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Logs
    access_log /var/log/nginx/skidjakt.access.log;
    error_log /var/log/nginx/skidjakt.error.log;
}
